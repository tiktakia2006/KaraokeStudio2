name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Збірка, модульні тести, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Збірка debug-APK
        run: gradle assembleDebug --stacktrace
      - name: Модульні тести
        run: gradle testDebugUnitTest --stacktrace
      - name: Lint
        run: gradle lintDebug --stacktrace
      - name: Артефакт — APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Артефакт — звіти
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results

  instrumented:
    name: Тести Room на емуляторі
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Увімкнути KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Інструментальні тести
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: gradle connectedDebugAndroidTest --stacktrace
