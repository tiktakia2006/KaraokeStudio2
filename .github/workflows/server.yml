name: Server CI

on:
  push:
    branches: [ main ]
    paths: [ 'server/**' ]
  pull_request:
    paths: [ 'server/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Тести сервера
        working-directory: server
        run: npm test
      - name: Короткий навантажувальний тест
        working-directory: server
        run: npm run loadtest -- --duration 5 --concurrency 8 --users 4 --assert-errors 0
